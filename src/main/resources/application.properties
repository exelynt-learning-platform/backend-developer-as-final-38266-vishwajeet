spring.application.name=ReservationManagementSystem

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/reservation_booking_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-this-in-production-12345678901234567890}
app.jwt.expiration=86400000

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html